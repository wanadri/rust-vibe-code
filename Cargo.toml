[package]
name = "rust-vibe-code"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
